# =============================================================================
# nginx/conf.d/emago.conf — VirtualHost Emago
# Agent 9 — DevOps | Sprint 1
#
# Routing :
#   /api/v1/*  → FastAPI :8000 (REST)
#   /ws        → FastAPI :8000 (WebSocket — headers Upgrade obligatoires)
#   /*         → React build (fichiers statiques)
#
# IMPORTANT : Remplacer YOUR_DOMAIN.COM par le vrai domaine avant déploiement
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # Challenge Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

    # SSL Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://YOUR_DOMAIN.COM;" always;

    # ── API REST ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts généreux pour les opérations longues (forge, combat)
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # CORS géré par FastAPI — Nginx ne doit pas ajouter ses propres headers CORS
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    # CRITIQUE : les headers Upgrade et Connection sont obligatoires
    # Sans eux, Nginx transforme la connexion WS en requête HTTP normale → 426
    location /ws {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        # Headers WebSocket obligatoires
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout long — les connexions WS vivent longtemps
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Désactiver le buffering pour les messages temps réel
        proxy_buffering off;
    }

    # ── React SPA (catch-all) ─────────────────────────────────────────────────
    # try_files : si le fichier existe, le servir ; sinon retourner index.html
    # (nécessaire pour React Router — toutes les routes renvoient index.html)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache agressif pour les assets avec hash (JS, CSS, images)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Pas de cache pour index.html (pour que les mises à jour soient immédiates)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Health check Nginx ───────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
